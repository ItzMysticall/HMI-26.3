name: Build and release

# Builds the mod on GitHub's runners and publishes the jar as a downloadable
# pre-release. Runs on every push to main, and can be started by hand from the
# Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: mod
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew build --no-daemon > ../build.log 2>&1
          status=$?
          tail -n 150 ../build.log
          if [ "$status" -ne 0 ]; then
            { grep -aE "error:|What went wrong|Could not|FAILED|Caused by" ../build.log | head -n 60; echo ----; tail -n 40 ../build.log; } > ../errs.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errs.txt)
            echo "::error title=Gradle build errors::${msg}"
            exit "$status"
          fi

      - name: Collect diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_diagnose.sh

      - name: Pick the jar
        id: jar
        run: |
          src=$(find mod/build/libs -name 'holdmyitems-*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$src" ]; then echo "No jar produced"; exit 1; fi
          mkdir -p dist
          cp "$src" dist/holdmyitems-5.1.2-mc26.3.jar
          echo "Built: $src"
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: holdmyitems-mc26.3
          path: dist/holdmyitems-5.1.2-mc26.3.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="5.1.2-mc26.3"
          notes="Unofficial Hold My Items build for Minecraft 26.3 (Fabric). Needs Fabric Loader 0.19.3+, Fabric API and Java 25. Not play-tested on 26.3 yet; report problems as issues."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/holdmyitems-5.1.2-mc26.3.jar --clobber
          else
            gh release create "$tag" dist/holdmyitems-5.1.2-mc26.3.jar \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "Hold My Items 5.1.2 for Minecraft 26.3 (unofficial)" \
              --notes "$notes"
          fi
